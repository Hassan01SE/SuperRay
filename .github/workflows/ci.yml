name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Django checks and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SuperRay-Backend
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: testserver
      DJANGO_SECURE_SSL_REDIRECT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SuperRay-Backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test superRayApp

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SuperRay-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: SuperRay-Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
